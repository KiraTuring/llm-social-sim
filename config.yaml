llm:
  provider: "deepseek"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  response_mode: "tool_call"  # tool_call | text_parse

simulation:
  max_ticks: 20
  mode: "interactive"  # interactive | auto
  auto_delay: 2
  rotate_order: false
  manual_agents: []  # 手动控制的 Agent 名称列表
  show_full_inbox: true  # 是否完整显示收件箱内容
  show_full_monologue: true  # 是否完整显示内心独白

agent:
  memory_short_limit: 10
  memory_compress_threshold: 30
  max_energy: 100
  content_max_length: 200

gm:
  use_llm: true
  random_event_chance: 0.0
  llm_event_chance: 0.5

scene: "tavern"

logging:
  file: "logs/simulation.log"
  level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR