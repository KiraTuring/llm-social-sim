llm:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  response_mode: "tool_call"  # tool_call | text_parse
  extra_params:               # 合并到 litellm.acompletion() 的额外参数，可覆盖 temperature
    thinking:
      type: enabled
    reasoning_effort: high

simulation:
  max_ticks: 20
  mode: "interactive"  # interactive | auto
  auto_delay: 2
  rotate_order: false
  manual_agents: []  # 手动控制的 Agent 名称列表
  show_full_inbox: true  # 是否完整显示收件箱内容
  show_full_monologue: false  # 是否完整显示内心独白

agent:
  prompt_format: "chat"  # "text"(flat text) | "chat"(multi-turn chat history)
  memory_short_limit: 10
  memory_compress_threshold: 30
  content_max_length: 200

gm:
  prompt_format: "chat"  # "text"(fresh each tick) | "chat"(persistent multi-turn)
  chat_history_max_messages: 40
  use_llm: true
  random_event_chance: 0.2
  llm_event_chance: 0.2
  message_limit: 5

scene: "tavern"

logging:
  file: "logs/simulation.log"
  level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR